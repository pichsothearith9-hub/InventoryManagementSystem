            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Inter;
            }
            body {
                background: #071133;
                color: white;
            }
            /* SIDEBAR */
            .sidebar {
                width: 260px;
                height: 100vh;
                position: fixed;
                left: 0;
                top: 0;
                background: #08164d;
                padding: 25px;
            }
            .logo {
                font-size: 28px;
                font-weight: 800;
                margin-bottom: 40px;
            }
            .main{
                background-color: white;
            }
            .menu a {
                display: flex;
                gap: 10px;
                padding: 14px;
                margin-bottom: 10px;
                color: white;
                text-decoration: none;
                border-radius: 12px;
                transition: .3s;
            }
            .menu a:hover {
                background: linear-gradient(135deg, #00f5c4, #6d5dfc);
                transform: translateX(6px);
            }
            /* MAIN */
            .main {
                margin-left: 260px;
                padding: 25px;
            }
            /* SEARCH */
            .search {
                margin-bottom: 20px;
            }
            .search input {
                width: 100%;
                padding: 14px;
                border: none;
                border-radius: 12px;
                outline: none;
            }
            /* HERO */
            .hero {
                background: linear-gradient(135deg, #1b2a6f, #6d5dfc);
                padding: 30px;
                border-radius: 20px;
                margin-bottom: 20px;
                position: relative;
                overflow: hidden;
            }
            .hero img {
                position: absolute;
                right: 20px;
                bottom: 0;
                width: 200px;
            }
            /* GRID */
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
            }
            /* CARD */
            .card {
                background: white;
                color: black;
                border-radius: 18px;
                overflow: hidden;
                transition: .3s;
            }
            .card:hover {
                transform: translateY(-8px);
            }
            .card img {
                width: 100%;
                height: 180px;
                object-fit: cover;
            }
            .card-body {
                padding: 15px;
            }
            .price {
                color: #6d5dfc;
                font-weight: 800;
                font-size: 20px;
                margin-top: 5px;
            }
            .btn {
                width: 100%;
                padding: 12px;
                border: none;
                margin-top: 10px;
                background: #6d5dfc;
                color: white;
                border-radius: 10px;
                cursor: pointer;
            }
            /* NOTI */
            .noti {
                position: fixed;
                top: 20px;
                right: -300px;
                background: #111827;
                padding: 15px;
                border-radius: 10px;
                transition: .4s;
            }
            .noti.show {
                right: 20px;
            }
        </style>

                }
            });
            const grid = document.getElementById("grid");
            const noti = document.getElementById("noti");
            const search = document.getElementById("search");
            /* RENDER */
            function render(list) {
                grid.innerHTML = "";
                list.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "card";
                    div.innerHTML = `
                <img src="${p.image}">
                <div class="card-body">
                    <h3>${p.name}</h3>
                    <div class="price">$${p.price}</div>
                </div>
            `;
                    grid.appendChild(div);
                });
            }
            render(products);
            /* BUY */
            function buy(name) {

            }-
