<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link rel="shortcut icon" href="./img/logo_inventory-removebg-preview.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Calisto MT';
        background-color: white;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        min-height: 100vh;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        padding: 0;
        border: 2px solid rgba(128, 128, 128, 0.39);
    }

    .card {
        border: none;
        border-radius: 0;
    }
    .card:nth-child(1) {
        background-color: #5B5BD6;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 30px;
        text-align: center;
    }

    .tittle p {
        font-size: 30px;
        color: white;
    }

    #icon {
        font-size: 38px;
    }

    .card:nth-child(1) img {
        max-width: 400px;
        width: 100%;
        margin-top: 20px;
    }


    .card:nth-child(2) {
        background-color: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(4px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
    }

    .login {
        width: 100%;
        max-width: 450px;
    }

    .Email,
    .password {
        margin-top: 25px;
    }

    .for {
        margin-top: 15px;
        text-align: center;

        & a {
            text-decoration: none;
        }
    }



    button {
        color: white;
        background-color: #5B5BD6;
    }

    .or {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 25px;

        & hr {
            width: 100%;
        }
    }


    .icon {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-top: 20px;
    }

    .google,
    .facebook {
        width: 100%;
        height: 55px;
        border-radius: 40px;
        background-color: rgba(222, 220, 220, 0.568);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px;
    }

    .google img {
        width: 50px;
        height: 38px;

    }

    .facebook img {
        width: 70px;
        height: 44px;
        margin-right: -10px;
    }

    .google a,
    .facebook a {
        text-decoration: none;
        color: black;

    }

    h6 {
        margin-top: 20px;
        text-align: center;
    }

    h6 a {
        text-decoration: none;
    }



    @media (max-width: 992px) {

        .container {
            grid-template-columns: 1fr;
        }

        .card:nth-child(1),
        .card:nth-child(2) {
            width: 100%;
            min-height: auto;
        }

        .card:nth-child(1) img {
            max-width: 300px;
        }

        .tittle p {
            font-size: 24px;
        }
    }

    @media (max-width: 768px) {

        .container {
            grid-template-columns: 1fr;
        }

        .card:nth-child(1),
        .card:nth-child(2) {
            padding: 20px;
        }

        .tittle p {
            font-size: 20px;
        }

        #icon {
            font-size: 30px;
        }

        .card:nth-child(1) img {
            max-width: 220px;
        }

        .icon {
            flex-direction: column;
            align-items: center;
        }

        .google,
        .facebook {
            width: 100%;
        }

        h1 {
            font-size: 28px;
        }
    }
</style>

<body>
    <div class="container">
        <div class="card">
            <div class="tittle">
                <p>
                    <i id="icon" class="fa-brands fa-algolia"></i>
                    Oh Hey!
                </p>
                <p>
                    Welcome To Inventory Management System...
                </p>
            </div>

            <img style="border-radius: 100%;" src="https://i.pinimg.com/736x/07/fb/34/07fb3452c4640d881a16d08c2e314f3e.jpg" alt="">

        </div>


        <div class="card">

            <div class="login">

                <form class="h-auto mx-auto mt-4 p-4">

                    <h1 class="text-center">Welcome Back</h1>

                    <p class="text-center">
                        let's login into your account
                    </p>

                    <div class="Email">
                        <label class="form-label fs-5">
                            Email:
                        </label>

                        <input placeholder="Please Enter Your Email" type="email" class="form-control">
                    </div>

                    <div class="password">
                        <label class="form-label fs-5">
                            Password:
                        </label>

                        <input placeholder="Please Enter Your Password" type="password" class="form-control">
                    </div>

                    <div class="for">
                        <a href="#">
                            forgot password?
                        </a>
                    </div>
                    <a href="./product.html">
                    <button type="submit" class="btn w-100 mt-3">
                        Login
                </a>
                    </button>
                    <div class="or">
                        <hr>
                        <p>OR</p>
                        <hr>
                    </div>

                    <div class="icon">

                        <div class="google">
                            <img style="height: auto;" src="./img/gmail-removebg-preview.png" alt="">
                            <a href="#">Google</a>
                        </div>

                        <div class="facebook">
                            <img src="./img/facebook-removebg-preview.png" alt="">
                            <a href="#">Facebook</a>
                        </div>

                    </div>

                    <h6>
                        Do you have an account?
                        <a href="#">Sign Up</a>
                    </h6>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
